<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FoodShare AI</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.6)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') center/cover fixed; }
        nav, footer { background: #2e7d32; color: white; padding: 15px 50px; }
        nav { display: flex; justify-content: space-between; align-items: center; }
        nav h2 { margin: 0; } nav ul { display: flex; gap: 20px; list-style: none; margin: 0; } nav a { color: white; text-decoration: none; font-weight: bold; }
        main { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
        form { width: 400px; padding: 40px; background: white; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
        h1 { color: #2e7d32; text-align: center; margin: 0 0 15px; } p { color: #666; line-height: 1.5; text-align: center; }
        label { display: block; color: #2e7d32; font-weight: bold; margin: 24px 0 8px; } input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 5px; background: #4caf50; color: white; font-size: 18px; font-weight: bold; cursor: pointer; } button:hover { background: #45a049; }
        .flash { color: #2e7d32; text-align: center; margin: 12px 0; word-break: break-word; } footer { text-align: center; }
        @media (max-width: 600px) { nav { padding: 15px 20px; } nav ul { gap: 10px; padding: 0; } form { padding: 28px 22px; } }
    </style>
</head>
<body>
    <nav><h2>FoodShare AI</h2><ul><li><a href="/">Home</a></li><li><a href="/login">Login</a></li></ul></nav>
    <main>
        <form action="{{ url_for('forgot_password') }}" method="POST">
            <h1>Forgot Password?</h1>
            <p>Enter your account email and we will send you a secure password reset link.</p>
            {% with messages = get_flashed_messages() %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required autocomplete="email">
            <button type="submit">Send Reset Link</button>
        </form>
    </main>
    <footer><p>© 2026 AI Food Waste Redistribution System</p></footer>
</body>
</html>
